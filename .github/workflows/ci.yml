name: CI Pipeline — Build & Agent Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-agent:
    name: Agent Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Static Syntax & Lint Check
        run: |
          flake8 pqc_agent/ app.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Unit & Integration Test Suite
        run: |
          python tests/test_pqc_agent.py

      - name: Run LangGraph E2E HITL State Machine Verification
        run: |
          python tests/test_graph_e2e.py
